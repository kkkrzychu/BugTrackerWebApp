<!DOCTYPE html>
<html>
<head>
<title>BugTracker WebApp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>BugTracker WebApp</h1>

<div id="add-bug">
    <input type="text" id="title" placeholder="Tytuł buga">
    <textarea id="description" placeholder="Opis buga"></textarea>
    <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>
</div>

<button id="add-button">Dodaj zgłoszenie</button>
<button id="refresh-button">Odśwież zgłoszenia</button>
<div id="bugs-list"></div>

<script src="script.js"></script>
</body>
</html>
